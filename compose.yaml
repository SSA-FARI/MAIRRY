name: mairry

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
      - root-node-modules:/workspace/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mairry}:${POSTGRES_PASSWORD:-mairry}@postgres:5432/${POSTGRES_DB:-mairry}
      DEMO_USER_ID: ${DEMO_USER_ID:?DEMO_USER_ID is required}
      DEMO_USER_LOGIN_ID: ${DEMO_USER_LOGIN_ID:?DEMO_USER_LOGIN_ID is required}
      DEMO_USER_DISPLAY_NAME: ${DEMO_USER_DISPLAY_NAME:?DEMO_USER_DISPLAY_NAME is required}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-mairry}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
      CORS_ORIGINS: http://localhost:3000
      ENABLE_DEMO_FALLBACK: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mairry}
      POSTGRES_USER: ${POSTGRES_USER:-mairry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mairry}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mairry} -d ${POSTGRES_DB:-mairry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-miniosecret} &&
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-mairry} &&
      mc anonymous set none local/${OBJECT_STORAGE_BUCKET:-mairry}
      "
    restart: "no"

volumes:
  frontend-node-modules:
  root-node-modules:
  postgres-data:
  minio-data:
