name: mairry

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
      - root-node-modules:/workspace/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mairry}:${POSTGRES_PASSWORD:-mairry}@postgres:5432/${POSTGRES_DB:-mairry}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mairry}:${POSTGRES_PASSWORD:-mairry}@postgres-test:5432/mairry_test
      DEMO_USER_ID: ${DEMO_USER_ID:?DEMO_USER_ID is required}
      DEMO_USER_LOGIN_ID: ${DEMO_USER_LOGIN_ID:?DEMO_USER_LOGIN_ID is required}
      DEMO_USER_DISPLAY_NAME: ${DEMO_USER_DISPLAY_NAME:?DEMO_USER_DISPLAY_NAME is required}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      # 브라우저가 여는 원문 미리보기 서명 URL은 컨테이너 내부 호스트(minio:9000)가 아니라
      # host에 노출된 이 주소로 서명해야 한다.
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-mairry}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
      CORS_ORIGINS: http://localhost:3000
      ENABLE_DEMO_FALLBACK: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./contracts:/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mairry}
      POSTGRES_USER: ${POSTGRES_USER:-mairry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mairry}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mairry} -d ${POSTGRES_DB:-mairry}"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: mairry_test
      POSTGRES_USER: ${POSTGRES_USER:-mairry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mairry}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mairry} -d mairry_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-miniosecret} &&
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-mairry} &&
      mc anonymous set none local/${OBJECT_STORAGE_BUCKET:-mairry}
      "
    restart: "no"
  postgres-e2e:
    image: postgres:16-alpine
    profiles: ["e2e"]
    environment:
      POSTGRES_DB: mairry_e2e
      POSTGRES_USER: ${POSTGRES_USER:-mairry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mairry}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mairry} -d mairry_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-e2e:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    profiles: ["e2e"]
    command:
      - /bin/sh
      - -c
      - python -m alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: e2e
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mairry}:${POSTGRES_PASSWORD:-mairry}@postgres-e2e:5432/mairry_e2e
      DEMO_USER_ID: 10000000-0000-0000-0000-000000000001
      DEMO_WEDDING_PLAN_ID: 10000000-0000-0000-0000-000000000002
      DEMO_MEMBER_ID: 10000000-0000-0000-0000-000000000003
      DEMO_USER_LOGIN_ID: demo-e2e
      DEMO_USER_DISPLAY_NAME: E2E Demo User
      DEMO_USER_EMAIL: ""
      AI_API_KEY: ""
      AI_MODEL: ""
      AI_BASE_URL: https://api.openai.com/v1
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-mairry}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
      CORS_ORIGINS: http://frontend-e2e:3000
      ENABLE_DEMO_FALLBACK: "true"
    depends_on:
      postgres-e2e:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend-e2e:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    profiles: ["e2e"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend-e2e:8000/api
    depends_on:
      backend-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  e2e:
    build:
      context: .
      dockerfile: frontend/Dockerfile.e2e
    profiles: ["e2e"]
    environment:
      E2E_BASE_URL: http://frontend-e2e:3000
    ipc: host
    depends_on:
      frontend-e2e:
        condition: service_healthy
    volumes:
      - ./playwright-report:/workspace/playwright-report
      - ./test-results:/workspace/test-results


volumes:
  frontend-node-modules:
  root-node-modules:
  postgres-data:
  minio-data:
