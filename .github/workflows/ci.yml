name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir frontend typecheck

      - name: Lint
        run: pnpm --dir frontend lint

      - name: Format check
        run: pnpm --dir frontend format:check

      - name: Automation script syntax
        run: node --check scripts/review-pr.mjs

      - name: Production build
        run: pnpm --dir frontend build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mairry_test
          POSTGRES_USER: mairry
          POSTGRES_PASSWORD: mairry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mairry -d mairry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mairry:mairry@localhost:5432/mairry_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic -c alembic.ini upgrade head

      - name: Ruff lint
        working-directory: backend
        run: python -m ruff check app ai tests

      - name: Ruff format check
        working-directory: backend
        run: python -m ruff format --check app ai tests

      - name: Pytest
        working-directory: backend
        run: python -m pytest

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validators
        run: python -m pip install -e "backend[dev]"

      - name: Validate contracts and examples
        run: python scripts/validate_contracts.py

      - name: Validate Compose configuration
        run: docker compose config --quiet
