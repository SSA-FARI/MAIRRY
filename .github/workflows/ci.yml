name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir frontend typecheck

      - name: Lint
        run: pnpm --dir frontend lint

      - name: Format check
        run: pnpm --dir frontend format:check

      - name: Production build
        run: pnpm --dir frontend build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: python -m ruff check app ai tests

      - name: Ruff format check
        working-directory: backend
        run: python -m ruff format --check app ai tests

      - name: Pytest
        working-directory: backend
        run: python -m pytest

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validators
        run: python -m pip install openapi-spec-validator jsonschema

      - name: Validate OpenAPI
        run: openapi-spec-validator contracts/openapi.yaml

      - name: Validate JSON Schemas
        shell: python
        run: |
          import json
          from pathlib import Path

          from jsonschema.validators import validator_for

          schema_paths = sorted(Path("contracts").glob("*.schema.json"))
          if not schema_paths:
              raise SystemExit("No JSON Schema files found")

          for path in schema_paths:
              schema = json.loads(path.read_text(encoding="utf-8"))
              validator_for(schema).check_schema(schema)
              print(f"validated: {path}")
