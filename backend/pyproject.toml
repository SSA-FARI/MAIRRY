[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mairry-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.20",
  "boto3>=1.35.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "jsonschema>=4.25.0",
  "openapi-spec-validator>=0.7.2",
  "PyYAML>=6.0.2",
  "pytest>=8.4.0",
  "ruff>=0.12.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "ai/tests"]
markers = ["integration: requires external infrastructure such as PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Security",
]

[tool.setuptools.packages.find]
include = ["app*", "ai*"]

[tool.setuptools.package-data]
"ai.document_extraction" = ["fallback_assets/*.fixture", "fallback_assets/*.json"]
